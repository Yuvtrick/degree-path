spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/degreepath}
spring.datasource.username=${DB_USERNAME:degreepath}
spring.datasource.password=${DB_PASSWORD}

# Schema changes must be explicit; Hibernate never alters the database.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
